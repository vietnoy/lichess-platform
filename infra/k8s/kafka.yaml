apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc
  namespace: chess
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 30Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-headless
  namespace: chess
spec:
  clusterIP: None
  selector:
    app: kafka
  ports:
    - name: controller
      port: 9093
      targetPort: 9093
    - name: broker
      port: 9092
      targetPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: chess
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
---
# External access for host-side producers (chess-ingestor systemd service on VPS).
apiVersion: v1
kind: Service
metadata:
  name: kafka-external
  namespace: chess
spec:
  type: NodePort
  selector:
    app: kafka
  ports:
    - name: external
      port: 9094
      targetPort: 9094
      nodePort: 30092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: chess
spec:
  serviceName: kafka-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
            - name: external
              containerPort: 9094
          env:
            # KRaft mode — no ZooKeeper.
            - name: KAFKA_NODE_ID
              value: "0"
            - name: KAFKA_PROCESS_ROLES
              value: "controller,broker"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-0.kafka-headless.chess.svc.cluster.local:9093"
            # Fixed cluster ID so the volume can be re-attached after a pod restart
            # without regenerating identity. 22-char base64 (16 random bytes).
            - name: CLUSTER_ID
              value: "MkU3OEVBNTcwNTJENDM2Qk"
            # Listeners: internal (broker peers + in-cluster clients), controller,
            # external (NodePort for the host-side chess-ingestor on the VPS).
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka.chess.svc.cluster.local:9092,EXTERNAL://160.187.0.108:30092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            # Retention 72h matches the 100GB disk plan (≈ 20GB at current ingest).
            - name: KAFKA_LOG_RETENTION_HOURS
              value: "72"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_NUM_PARTITIONS
              value: "6"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_HEAP_OPTS
              value: "-Xms1g -Xmx2g"
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 90
            periodSeconds: 30
          resources:
            requests:
              memory: 2Gi
              cpu: 250m
            limits:
              memory: 4Gi
              cpu: 1500m
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kafka-pvc
---
# One-shot topic creation. Runs after the broker is reachable.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-bootstrap-topics
  namespace: chess
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: apache/kafka:3.9.0
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              BS="kafka.chess.svc.cluster.local:9092"
              echo "waiting for broker $BS"
              for i in $(seq 1 60); do
                if /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$BS" >/dev/null 2>&1; then
                  echo "broker ready"
                  break
                fi
                sleep 5
              done
              ensure() {
                local topic=$1 parts=$2
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" --create --if-not-exists \
                  --topic "$topic" --partitions "$parts" --replication-factor 1
              }
              ensure lichess.game_start 6
              ensure lichess.moves 12
              ensure lichess.game_end 6
              echo "---topics---"
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" --list
