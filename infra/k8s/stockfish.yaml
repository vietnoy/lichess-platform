apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockfish
  namespace: chess
spec:
  replicas: 8
  # Brief stockfish downtime during rollout is fine; worker has a retry loop and
  # the FEN cache absorbs most steady-state load anyway.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 2
  selector:
    matchLabels:
      app: stockfish
  template:
    metadata:
      labels:
        app: stockfish
    spec:
      containers:
        - name: stockfish
          image: vietnoy/chess-stockfish:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8001
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: stockfish
  namespace: chess
spec:
  selector:
    app: stockfish
  ports:
    - port: 8001
      targetPort: 8001
